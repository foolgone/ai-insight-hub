version: '3.8'

services:
  # PostgreSQL with pgvector
  postgres:
    image: pgvector/pgvector:pg14
    container_name: aiinsight-postgres
    environment:
      POSTGRES_USER: aiinsight
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: aiinsight
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    command: >
      postgres
      -c shared_preload_libraries=vector
      -c max_connections=200
      -c shared_buffers=256MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiinsight"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aiinsight-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: aiinsight-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - aiinsight-network

  # MinIO (S3-compatible object storage)
  minio:
    image: minio/minio:latest
    container_name: aiinsight-minio
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - aiinsight-network

  # MinIO 初始化（创建 bucket）
  minio-init:
    image: minio/mc:latest
    container_name: aiinsight-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/aiinsight-uploads --ignore-existing;
      /usr/bin/mc mb myminio/aiinsight-reports --ignore-existing;
      exit 0;
      "
    networks:
      - aiinsight-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  aiinsight-network:
    driver: bridge
