name: E2E

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: 前端 E2E（真实栈）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg14
        env:
          POSTGRES_USER: aiinsight
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: aiinsight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiinsight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://aiinsight:dev_password@localhost:5432/aiinsight_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      JWT_SECRET_KEY: e2e-ci-secret-key-not-for-production
      RATE_LIMIT_ENABLED: "false"
      PROMETHEUS_ENABLED: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      E2E_BROWSER_CHANNEL: chromium
      E2E_BASE_URL: http://127.0.0.1:5173
      E2E_API_ORIGIN: http://127.0.0.1:8000
      # Vite 代理 target 为 localhost:8000；强制 IPv4 优先，避免 Node 20 解析到 ::1
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - uses: actions/checkout@v4

      - name: 后端依赖
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: 安装后端依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 初始化测试库（扩展 + 迁移）
        working-directory: backend
        run: |
          PGPASSWORD=dev_password psql -h localhost -U aiinsight -d aiinsight_test -f scripts/init_db.sql
          alembic upgrade head

      - name: 启动后端
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then echo "backend up"; exit 0; fi
            sleep 1
          done
          echo "backend failed to start"; tail -100 /tmp/backend.log; exit 1

      - name: 前端依赖
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖与浏览器
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: 启动前端
        working-directory: frontend
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then echo "frontend up"; exit 0; fi
            sleep 1
          done
          echo "frontend failed to start"; tail -100 /tmp/frontend.log; exit 1

      - name: 运行 E2E（Playwright + Chromium）
        working-directory: frontend
        run: npm run test:e2e

      - name: 失败时上传报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: 失败时输出服务日志
        if: failure()
        run: |
          echo "===== backend ====="; tail -200 /tmp/backend.log || true
          echo "===== frontend ====="; tail -100 /tmp/frontend.log || true
