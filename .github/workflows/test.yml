name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg14
        env:
          POSTGRES_USER: aiinsight
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: aiinsight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiinsight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: 准备测试库扩展
        run: |
          PGPASSWORD=dev_password psql -h localhost -U aiinsight -d aiinsight_test -f scripts/init_db.sql
      - name: 单元测试 + 覆盖率（阈值 80%）
        env:
          DATABASE_URL: postgresql://aiinsight:dev_password@localhost:5432/aiinsight_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest -m "not prompt" --cov=app --cov-report=term-missing --cov-fail-under=80
      - name: 代码质量
        run: |
          black --check app tests
          flake8 app tests

  frontend:
    name: 前端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: Lint
        run: npm run lint
      # 骨架阶段还没有用例：先跑 test:run 保证 CI 绿；用例补齐后改为 test:coverage（含 80% 门禁）
      - name: 单元测试
        run: npm run test:run
