worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    # 单文件上传上限：与后端 MAX_UPLOAD_SIZE_MB=100 对齐，留 multipart 余量
    client_max_body_size 120m;

    # 文本压缩（F-508）：gzip 由 Nginx 负责，不加 Vite 压缩插件
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        image/svg+xml
        font/woff2;

    upstream aiinsight_api {
        server api:8000;
    }

    # 默认（VM / 内网）：仅 HTTP。站点 location 共用 snippets/aiinsight-locations.conf
    server {
        listen 80;
        server_name _;

        include /etc/nginx/snippets/aiinsight-locations.conf;
    }
}
