worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 60m;

    # 文本压缩（F-508）：gzip 由 Nginx 负责，不加 Vite 压缩插件
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        image/svg+xml
        font/woff2;

    upstream aiinsight_api {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # 前端静态资源：带 hash 的 assets 长缓存
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # SPA 回退（F-508）：/login、/dashboard 等刷新不 404
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 任务进度 SSE（T11）：关闭缓冲/缓存，保证服务端逐条推送
        location = /api/v1/tasks/stream {
            proxy_pass http://aiinsight_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            gzip off;
        }

        # 对外 API（含 OpenAPI 文档）
        location /api/ {
            proxy_pass http://aiinsight_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /docs {
            proxy_pass http://aiinsight_api;
        }

        location /openapi.json {
            proxy_pass http://aiinsight_api;
        }

        location /health {
            proxy_pass http://aiinsight_api;
        }

        # 指标只允许内网采集（按需改成 Prometheus 网段）
        location /metrics {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://aiinsight_api;
        }
    }
}
