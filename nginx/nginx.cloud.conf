worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    # 单文件上传上限：与后端 MAX_UPLOAD_SIZE_MB=100 对齐，留 multipart 余量
    client_max_body_size 120m;

    # 请求耗时日志（#4）：rt=总耗时、urt=上游耗时，排查「上传/接口慢在哪」不用猜
    log_format aiih '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout aiih;

    # 文本压缩（F-508）：gzip 由 Nginx 负责，不加 Vite 压缩插件
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        image/svg+xml
        font/woff2;

    upstream aiinsight_api {
        server api:8000;
    }

    # 云端：HTTP（内网/健康检查）
    server {
        listen 80;
        server_name _;

        include /etc/nginx/snippets/aiinsight-locations.conf;
    }

    # 云端：HTTPS 8443（免备案非标端口）。证书由 certbot 生成，
    # 通过 compose 挂载到 /etc/nginx/certs（只读）。
    server {
        listen 8443 ssl;
        server_name bjwplus.dpdns.org;

        ssl_certificate     /etc/nginx/certs/live/bjwplus.dpdns.org/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/bjwplus.dpdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        include /etc/nginx/snippets/aiinsight-locations.conf;
    }
}
