<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">
  <defs>
    <marker id="down" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 5 10 L 10 0 z" fill="#17160F"/>
    </marker>
    <marker id="accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C8452A"/>
    </marker>
  </defs>

  <rect width="1440" height="1180" fill="#FAF8F3"/>

  <text x="60" y="58" font-family="Georgia,'Songti SC',serif" font-size="29" fill="#17160F">AI Insight Hub · 优化后的分层架构</text>
  <text x="60" y="84" font-size="12" fill="#6B675C">137 个源文件 · 5 条分层契约全绿 · 契约欠账 10 → 3（仅剩 core 的职责边界）</text>

  <!-- ===================== 左：分层栈 ===================== -->
  <text x="60" y="124" font-size="11" letter-spacing="2" fill="#C8452A">LAYERS · 只允许向下依赖</text>

  <!-- api -->
  <rect x="60" y="140" width="820" height="76" fill="#FFFFFF" stroke="#17160F" stroke-width="1.2"/>
  <text x="80" y="166" font-size="14" fill="#17160F" font-weight="bold">api/ · 13 文件　HTTP 边界</text>
  <text x="80" y="188" font-size="11.5" fill="#4A463C">v1 路由 · JWT / RBAC · BYOK 守门（428）· 分页参数解析（Query 校验）</text>
  <text x="80" y="206" font-size="11" fill="#8A8578">禁止：直接写库（session.add）· 直接 import tasks</text>

  <line x1="470" y1="216" x2="470" y2="236" stroke="#17160F" stroke-width="1.2" marker-end="url(#down)"/>

  <!-- tasks -->
  <rect x="60" y="238" width="820" height="66" fill="#FFFFFF" stroke="#17160F" stroke-width="1.2"/>
  <text x="80" y="264" font-size="14" fill="#17160F" font-weight="bold">tasks/ · 7 文件　Celery 入口（纯叶子）</text>
  <text x="80" y="286" font-size="11.5" fill="#4A463C">clean / evaluate / extract / insight / report / monitor_cost · 只做转发与 asyncio.run</text>

  <line x1="470" y1="304" x2="470" y2="324" stroke="#17160F" stroke-width="1.2" marker-end="url(#down)"/>

  <!-- services -->
  <rect x="60" y="326" width="820" height="86" fill="#FFFFFF" stroke="#17160F" stroke-width="1.2"/>
  <text x="80" y="352" font-size="14" fill="#17160F" font-weight="bold">services/ · 20 文件　用例编排 + 事务边界</text>
  <text x="80" y="374" font-size="11.5" fill="#4A463C">cleaning · evaluation · knowledge · insight · report · task · credential · asr · media</text>
  <text x="80" y="394" font-size="11.5" fill="#4A463C">归属校验（assert_owner）· session.flush() · 只调仓储与端口，不持有 Celery 任务对象</text>

  <line x1="470" y1="412" x2="470" y2="432" stroke="#17160F" stroke-width="1.2" marker-end="url(#down)"/>

  <!-- application -->
  <rect x="60" y="434" width="820" height="78" fill="#F3EFE6" stroke="#17160F" stroke-width="1.2"/>
  <text x="80" y="460" font-size="14" fill="#17160F" font-weight="bold">application/ · 4 文件　无框架细节的编排</text>
  <text x="80" y="482" font-size="11.5" fill="#4A463C">media_pipeline（转写，依赖注入 transcriber / resolve_asr）· structure_service（QA/知识点/摘要）</text>
  <text x="80" y="500" font-size="11.5" fill="#4A463C">task_control（取消查询）</text>

  <line x1="470" y1="512" x2="470" y2="532" stroke="#17160F" stroke-width="1.2" marker-end="url(#down)"/>

  <!-- agents -->
  <rect x="60" y="534" width="820" height="78" fill="#FFFFFF" stroke="#17160F" stroke-width="1.2"/>
  <text x="80" y="560" font-size="14" fill="#17160F" font-weight="bold">agents/ · 14 文件　LLM 能力层</text>
  <text x="80" y="582" font-size="11.5" fill="#4A463C">BaseAgent：BYOK（CredentialPort）· 重试 · 成本记账 · 降级 · 结构化输出兜底</text>
  <text x="80" y="600" font-size="11.5" fill="#4A463C">cleaning · structure · evaluation · extraction · insight · report</text>

  <line x1="470" y1="612" x2="470" y2="632" stroke="#17160F" stroke-width="1.2" marker-end="url(#down)"/>

  <!-- repositories -->
  <rect x="60" y="634" width="820" height="76" fill="#FFFFFF" stroke="#17160F" stroke-width="1.2"/>
  <text x="80" y="660" font-size="14" fill="#17160F" font-weight="bold">repositories/ · 6 文件　SQL 唯一入口</text>
  <text x="80" y="682" font-size="11.5" fill="#4A463C">cleaned_data · knowledge_base · analysis_results · raw_data · pagination（分页执行）</text>
  <text x="80" y="700" font-size="11" fill="#8A8578">只搬 SQL，不搬规则：去重策略 / 状态机 / 归属校验仍在 service</text>

  <line x1="470" y1="710" x2="470" y2="730" stroke="#17160F" stroke-width="1.2" marker-end="url(#down)"/>

  <!-- ports -->
  <rect x="60" y="732" width="820" height="70" fill="#F3EFE6" stroke="#17160F" stroke-width="1.2"/>
  <text x="80" y="758" font-size="14" fill="#17160F" font-weight="bold">ports/ · 4 文件　抽象接口（Protocol）</text>
  <text x="80" y="780" font-size="11.5" fill="#4A463C">LLMPort（chat/aclose）· TranscriberPort（→ Transcript dataclass）· CredentialPort（BYOK）</text>

  <line x1="470" y1="802" x2="470" y2="822" stroke="#17160F" stroke-width="1.2" marker-end="url(#down)"/>

  <!-- models / schemas -->
  <rect x="60" y="824" width="400" height="66" fill="#FFFFFF" stroke="#17160F" stroke-width="1.2"/>
  <text x="80" y="850" font-size="13.5" fill="#17160F" font-weight="bold">models/ · 12</text>
  <text x="80" y="872" font-size="11" fill="#4A463C">SQLAlchemy ORM 实体</text>

  <rect x="480" y="824" width="400" height="66" fill="#FFFFFF" stroke="#17160F" stroke-width="1.2"/>
  <text x="500" y="850" font-size="13.5" fill="#17160F" font-weight="bold">schemas/ · 22</text>
  <text x="500" y="872" font-size="11" fill="#4A463C">Pydantic DTO（请求 / 响应 / Agent 契约）</text>

  <line x1="470" y1="890" x2="470" y2="910" stroke="#17160F" stroke-width="1.2" marker-end="url(#down)"/>

  <!-- core -->
  <rect x="60" y="912" width="820" height="70" fill="#FFFFFF" stroke="#17160F" stroke-width="1.2"/>
  <text x="80" y="938" font-size="14" fill="#17160F" font-weight="bold">core/ · 20 文件　共享内核（无业务）</text>
  <text x="80" y="960" font-size="11.5" fill="#4A463C">配置 · DB 会话 · 安全/加密 · 统一错误码 · Redis · 成本 · 降级 · 指标 · URL 白名单</text>

  <!-- 分层注释 -->
  <text x="60" y="1012" font-size="11" fill="#8A8578">依赖方向：api → tasks → services → application → agents → repositories → ports → models → schemas → core</text>
  <text x="60" y="1032" font-size="11" fill="#8A8578">唯一例外：core 的 3 个模块需要 models/schemas（分页 DTO、成本记录、归属校验），已在契约里逐条登记</text>

  <!-- ===================== 右：组合根 + 门禁 ===================== -->
  <text x="940" y="124" font-size="11" letter-spacing="2" fill="#C8452A">COMPOSITION · CI GATES</text>

  <!-- composition -->
  <rect x="940" y="140" width="440" height="126" fill="#FFFFFF" stroke="#C8452A" stroke-width="1.3"/>
  <text x="960" y="166" font-size="14" fill="#C8452A" font-weight="bold">composition/ · 组合根（不在栈内）</text>
  <text x="960" y="190" font-size="11.5" fill="#4A463C">executors：task_type → 执行器（重试也走这里）</text>
  <text x="960" y="212" font-size="11.5" fill="#4A463C">enqueue：唯一调用 Celery .delay() 的地方</text>
  <text x="960" y="238" font-size="11" fill="#8A8578">装配代码天生知道所有实现，所以放在分层栈之外</text>
  <text x="960" y="256" font-size="11" fill="#8A8578">services / tasks 只能通过回调或返回值与它交互</text>

  <!-- gates -->
  <rect x="940" y="288" width="440" height="196" fill="#FFFFFF" stroke="#17160F" stroke-width="1.2"/>
  <text x="960" y="314" font-size="14" fill="#17160F" font-weight="bold">CI 门禁（全部阻塞）</text>
  <text x="960" y="338" font-size="11.5" fill="#4A463C">declared-layers　　　　　分层栈 + 欠账登记</text>
  <text x="960" y="358" font-size="11.5" fill="#4A463C">http-layer-not-depended-on　业务层不得 import api</text>
  <text x="960" y="378" font-size="11.5" fill="#4A463C">data-layer-is-leaf　　　　models/schemas 不依赖上层</text>
  <text x="960" y="398" font-size="11.5" fill="#4A463C">ports-are-inner　　　　　端口不依赖实现</text>
  <text x="960" y="418" font-size="11.5" fill="#4A463C">repositories-are-inner　　仓储不依赖上层</text>
  <text x="960" y="440" font-size="11.5" fill="#C8452A">写库门禁：api / application 禁止 session.add</text>
  <text x="960" y="462" font-size="11" fill="#8A8578">black · flake8 · mypy · pytest(645) · 覆盖率 80%</text>

  <!-- flow -->
  <rect x="940" y="504" width="440" height="238" fill="#FFFFFF" stroke="#17160F" stroke-width="1.2"/>
  <text x="960" y="530" font-size="14" fill="#17160F" font-weight="bold">一次上传的调用链</text>
  <text x="960" y="556" font-size="11.5" fill="#4A463C">1  api 校验 + 存文件 → repositories.raw_data.add</text>
  <text x="960" y="578" font-size="11.5" fill="#4A463C">2  services.create_clean_task（建任务行）</text>
  <text x="960" y="600" font-size="11.5" fill="#4A463C">3  composition.enqueue → Celery（clean 队列）</text>
  <text x="960" y="622" font-size="11.5" fill="#4A463C">4  tasks.clean_datasource → services.run_clean_task</text>
  <text x="960" y="644" font-size="11.5" fill="#4A463C">5  application.media_pipeline（注入 transcriber）</text>
  <text x="960" y="666" font-size="11.5" fill="#4A463C">6  agents.BaseAgent（CredentialPort 取 BYOK Key）</text>
  <text x="960" y="688" font-size="11.5" fill="#4A463C">7  application.structure_service（QA/知识/摘要）</text>
  <text x="960" y="710" font-size="11.5" fill="#4A463C">8  repositories 落库 → SSE 推进度</text>
  <text x="960" y="732" font-size="11" fill="#8A8578">acks_late 仅 clean 任务 · 已完成任务重投递直接短路</text>

  <!-- debt -->
  <rect x="940" y="762" width="440" height="150" fill="#F3EFE6" stroke="#17160F" stroke-width="1.2"/>
  <text x="960" y="788" font-size="14" fill="#17160F" font-weight="bold">剩余欠账（3 条）</text>
  <text x="960" y="812" font-size="11.5" fill="#4A463C">core.pagination → schemas.base（分页常量）</text>
  <text x="960" y="832" font-size="11.5" fill="#4A463C">core.cost_tracker → models（成本记账）</text>
  <text x="960" y="852" font-size="11.5" fill="#4A463C">core.ownership → models（归属校验）</text>
  <text x="960" y="880" font-size="11" fill="#8A8578">本质是「core 承担了部分业务职责」</text>
  <text x="960" y="898" font-size="11" fill="#8A8578">清理收益递减，已显式登记而非隐藏</text>

  <!-- legend -->
  <line x1="60" y1="1080" x2="120" y2="1080" stroke="#17160F" stroke-width="1.4" marker-end="url(#down)"/>
  <text x="132" y="1084" font-size="11" fill="#4A463C">依赖方向（单向）</text>
  <rect x="300" y="1070" width="14" height="14" fill="#F3EFE6" stroke="#17160F" stroke-width="1"/>
  <text x="322" y="1084" font-size="11" fill="#4A463C">无框架细节的编排层 / 抽象接口</text>
  <text x="60" y="1112" font-size="11" fill="#8A8578">注：tasks 位于 api 之下，是因为它只被 worker 与组合根调用；它不是业务层，也不是 HTTP 层。</text>
</svg>
