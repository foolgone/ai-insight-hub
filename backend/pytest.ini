[pytest]
testpaths = tests
# POC 验证脚本不进主 CI，需显式运行 `pytest tests/poc`
norecursedirs = .* venv .venv build dist *.egg tests/poc
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# 默认排除 prompt（真实 LLM 调用）；需要时显式 `pytest -m prompt`
addopts = -q --strict-markers -m "not prompt"
markers =
    unit: 单元测试（不依赖外部服务）
    integration: 集成测试（需要真实 PostgreSQL/Redis，见 docker-compose.test.yml）
    prompt: Prompt 测试（需要真实 LLM，默认排除：pytest -m "not prompt"）
    slow: 慢速测试
