[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -q --strict-markers
markers =
    unit: 单元测试（不依赖外部服务）
    integration: 集成测试（需要真实 PostgreSQL/Redis，见 docker-compose.test.yml）
    prompt: Prompt 测试（需要真实 LLM，默认排除：pytest -m "not prompt"）
    slow: 慢速测试
